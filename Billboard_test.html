    function sanitizeInterval(val) {

        'claycity':       { name: 'Clay City, IL',      tab: 'Clay City',        lat: 37.802706, lon: -89.226319 },
        'desoto':         { name: 'De Soto, IL',        tab: 'De Soto',          lat: 37.802706, lon: -89.226319 },
        'flora':          { name: 'Flora, IL',          tab: 'Flora',            lat: 38.668700, lon: -88.485300 },
        'floratv':        { name: 'Flora TV, IL',       tab: 'Flora Tv',         lat: 38.668700, lon: -88.485300 },
        'marshall':       { name: 'Marshall, IL',       tab: 'Marshall',         lat: 39.383585, lon: -87.721159 },
        'oliver':         { name: 'Oliver, IL',         tab: 'Oliver',           lat: 39.490667, lon: -87.682008 },
        'xeniabillboard': { name: 'Xenia Billboard, IL', tab: 'Xenia Billboard',  lat: 38.518540, lon: -88.649680 },
        'xeniatv':        { name: 'Xenia TV, IL',        tab: 'Xenia TV',         lat: 38.518540, lon: -88.649680 },
        'xenia':          { name: 'Xenia, IL',          tab: 'Xenia Billboard',  lat: 38.518540, lon: -88.649680 },
        'global':         { name: 'Global Hub',         tab: 'Global',           lat: 39.124300, lon: -88.552500 }
    };

    function getActiveLocation() {
        const rootEl = document.getElementById('sk-billboard-root-container');
        const htmlAttrLocation = rootEl ? rootEl.getAttribute('data-billboard-location') : null;
        const urlParams = new URLSearchParams(window.location.search);
        const urlLocation = urlParams.get('loc') || urlParams.get('location') || urlParams.get('billboard') || urlParams.get('tab');
        
        const raw = (htmlAttrLocation || urlLocation || 'Altamont').trim();
        const key = raw.toLowerCase().replace(/[^a-z0-9]/g, '');
        
        return {
            key: key,
            tabName: raw,
            coords: BILLBOARD_LOCATIONS[key] || { lat: 38.989268, lon: -88.959890 }
        };
    }

    const activeConfig = getActiveLocation();

    let currentAdIndex = 0;
    let adSlideElements = [];
    let lastWeatherData = null; 
    let targetTimeZone = "America/Chicago";
    let isNightTimeSolar = null; 
    let interactionTimer;
    let currentImageUrls = [];
    let currentQuarterTracker = null;

    window.handleInteraction = function() {
        const backBtn = document.getElementById('ghost-back-btn');
        const fsBtn = document.getElementById('fullscreen-toggle-btn');
        if(backBtn) backBtn.classList.add('active');
        if(fsBtn) fsBtn.classList.add('active');
        clearTimeout(interactionTimer);
        interactionTimer = setTimeout(() => { 
            if(backBtn) backBtn.classList.remove('active'); 
            if(fsBtn) fsBtn.classList.remove('active'); 
        }, 3000);
    }

    window.toggleFullScreen = function() {
        const root = document.documentElement;
        if (!document.fullscreenElement) { 
            if (root.requestFullscreen) root.requestFullscreen();
            else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
            else if (root.msRequestFullscreen) root.msRequestFullscreen();
        } else { 
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    };

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(
        evt => document.addEventListener(evt, updateFsIcon)
    );

    function updateFsIcon() {
        const fsIcon = document.getElementById('fs-icon');
        const fsText = document.querySelector('#fullscreen-toggle-btn span');
        if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
            if(fsIcon) fsIcon.setAttribute('data-lucide', 'minimize');
            if(fsText) fsText.innerText = "Exit Full Screen";
        } else {
            if(fsIcon) fsIcon.setAttribute('data-lucide', 'maximize');
            if(fsText) fsText.innerText = "Full Screen";
        }
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function syncTimeTheme() {
        const root = document.getElementById('sk-billboard-root-container');
        if (!root) return;
        
        let isNight = false;
        if (isNightTimeSolar !== null) {
            isNight = isNightTimeSolar;
        } else {
            const currentHour = new Date().getHours();
            isNight = (currentHour < 6 || currentHour >= 19);
        }

        if (isNight) {
            root.classList.add('dark-mode');
            root.classList.remove('light-mode');
        } else {
            root.classList.add('light-mode');
            root.classList.remove('dark-mode');
        }
        if (lastWeatherData) updateWeatherUI(lastWeatherData);
    }

    function parseCsvRow(row) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
            const char = row[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim().replace(/^"|"$/g, ''));
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current.trim().replace(/^"|"$/g, ''));
        return result;
    }

    function extractGoogleDriveId(url) {
        if (!url) return null;
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                      url.match(/id=([a-zA-Z0-9_-]+)/) || 
                      url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        return (match && match[1]) ? match[1] : null;
    }

    function formatBillboardImage(url) {
        if (!url) return "";
        let clean = url.trim().replace(/^"|"$/g, '').replace(/&amp;/g, '&');
        const driveId = extractGoogleDriveId(clean);
        if (driveId) {
            return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1920`;
        }
        if (clean.startsWith('//')) {
            clean = window.location.protocol + clean;
        }
        return clean;
    }

    function parseMultiplier(val) {
        if (!val) return 1;
        const cleaned = String(val).replace(/[^0-9]/g, '');
        const num = parseInt(cleaned, 10);
        return (!isNaN(num) && num > 0) ? num : 1;
    }

    // Spread Multiplexer Shuffle (Preserves Row-Order while spreading multipliers without duplicate back-to-backs)
    function distributeSpreadAds(items) {
        if (!items || items.length === 0) return [];
        if (items.length === 1) {
            const res = [];
            for (let i = 0; i < items[0].multiplier; i++) res.push(items[0].url);
            return res;
        }

        const pool = items.map((item, idx) => ({
            rowIndex: idx,
            name: item.name,
            url: item.url,
            remaining: item.multiplier
        }));

        const result = [];
        let previousUrl = null;

        while (pool.some(item => item.remaining > 0)) {
            const available = pool.filter(item => item.remaining > 0);
            
            let candidate = available.find(item => item.url !== previousUrl);
            if (!candidate) {
                candidate = available[0];
            }

            result.push(candidate.url);
            candidate.remaining--;
            previousUrl = candidate.url;
        }

        return result;
    }

    // Fetches CSV for any given tab name with robust encoding & fallbacks
    async function fetchCsvByTabName(tabName) {
        if (!tabName) return [];
        const cleanTabName = tabName.trim();
        const encodedTab = encodeURIComponent(cleanTabName);
        const url1 = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodedTab}&t=${Date.now()}`;
        const url2 = `${PUB_BASE_URL}?output=csv&sheet=${encodedTab}&t=${Date.now()}`;

        try {
            let res = await fetch(url1);
            if (!res.ok) res = await fetch(url2);
            if (!res.ok) return [];
            
            const text = await res.text();
            if (!text || text.includes("<!DOCTYPE html>")) return [];
            
            const lines = text.split(/\r?\n/);
            const items = [];

            lines.forEach((line, idx) => {
                if (idx === 0 || !line.trim()) return; // Skip Header
                const cols = parseCsvRow(line);

                let name = cols[0] ? cols[0].trim() : `Ad_Row_${idx + 1}`;
                let rawUrl = cols[1] || "";
                
                if (!rawUrl || (!rawUrl.includes("http") && !rawUrl.includes("drive.google"))) {
                    for (let c = 0; c < cols.length; c++) {
                        const val = (cols[c] || '').trim();
                        if (val.startsWith("http://") || val.startsWith("https://") || val.includes("drive.google.com") || val.startsWith("//")) {
                            rawUrl = val;
                            break;
                        }
                    }
                }

                let multiplier = parseMultiplier(cols[2]);
                let url = formatBillboardImage(rawUrl);

                if (url && url.startsWith('http')) {
                    items.push({ name: name, url: url, multiplier: multiplier, originalRow: idx + 1 });
                }
            });

            return items;
        } catch (e) {
            return [];
        }
    }

    // Fetches the Global Tab using both named query and direct first-tab index (gid=0)
    async function fetchGlobalTabAds() {
        // 1. Try named tab 'Global'
        let ads = await fetchCsvByTabName('Global');
        if (ads && ads.length > 0) return ads;

        // 2. Try raw published base URL (gid=0 index for first tab)
        try {
            const res = await fetch(`${PUB_BASE_URL}?output=csv&gid=0&t=${Date.now()}`);
            if (res.ok) {
                const text = await res.text();
                if (text && !text.includes("<!DOCTYPE html>")) {
                    const lines = text.split(/\r?\n/);
                    const items = [];
                    lines.forEach((line, idx) => {
                        if (idx === 0 || !line.trim()) return;
                        const cols = parseCsvRow(line);
                        let name = cols[0] ? cols[0].trim() : `Global_Row_${idx + 1}`;
                        let rawUrl = cols[1] || cols[2] || "";
                        let url = formatBillboardImage(rawUrl);
                        let multiplier = parseMultiplier(cols[2]);
                        if (url && url.startsWith('http')) {
                            items.push({ name: name, url: url, multiplier: multiplier, originalRow: idx + 1 });
                        }
                    });
                    if (items.length > 0) return items;
                }
            }
        } catch (e) {}

        return [];
    }

    // Fetches Active Town Tab + Global Tab in Exact Row Order
    async function fetchAdImages(isAutoSync = false) {
        try {
            const currentTab = activeConfig.tabName;
            const isTargetGlobal = (currentTab.toLowerCase() === 'global');
            
            // Simultaneously fetch Town Tab & Global Tab
            const [townAds, globalAds] = await Promise.all([
                fetchCsvByTabName(currentTab),
                !isTargetGlobal ? fetchGlobalTabAds() : Promise.resolve([])
            ]);

            // Combine ads: Town Tab rows first, then Global Tab rows
            let combinedAds = [...townAds, ...globalAds];

            // Fallback: If both tabs were empty, fetch the primary published sheet feed
            if (combinedAds.length === 0) {
                const fallbackRes = await fetch(`${PUB_BASE_URL}?output=csv&t=${Date.now()}`);
                const fallbackText = await fallbackRes.text();
                const fallbackLines = fallbackText.split(/\r?\n/);
                fallbackLines.forEach((line, idx) => {
                    if (idx === 0 || !line.trim()) return;
                    const cols = parseCsvRow(line);
                    let name = cols[0] ? cols[0].trim() : `Ad_Row_${idx + 1}`;
                    let rawUrl = cols[1] || cols[2] || "";
                    let url = formatBillboardImage(rawUrl);
                    let multiplier = parseMultiplier(cols[2]);
                    if (url && url.startsWith('http')) {
                        combinedAds.push({ name, url, multiplier, originalRow: idx + 1 });
                    }
                });
            }

            // Distribute through Spread Multiplier in row order (No back-to-back repeats)
            const finalUrls = distributeSpreadAds(combinedAds);

            if (finalUrls.length > 0 && JSON.stringify(finalUrls) !== JSON.stringify(currentImageUrls)) {
                currentImageUrls = finalUrls;
                renderSlides();
            }
        } catch (e) { 
            console.warn("Billboard Dual Tab Sync Engine Warning:", e); 
        }
    }

    function renderSlides() {
        const viewport = document.getElementById('sk-ad-viewport');
        if (!viewport) return;
        viewport.innerHTML = '';
        adSlideElements = [];
        currentAdIndex = 0;
        
        currentImageUrls.forEach((url, idx) => {
            const slide = document.createElement('div');
            slide.className = `sk-ad-slide ${idx === 0 ? 'active' : ''}`;
            const image = document.createElement('img');
            image.src = url;
            image.setAttribute('referrerpolicy', 'no-referrer');
            image.setAttribute('crossorigin', 'anonymous');
            
            image.onerror = function() {
                const driveId = extractGoogleDriveId(this.src);
                if (driveId && !this.dataset.fallbackTried) {
                    this.dataset.fallbackTried = "1";
                    this.src = `https://lh3.googleusercontent.com/d/${driveId}`;
                } else if (driveId && this.dataset.fallbackTried === "1") {
                    this.dataset.fallbackTried = "2";
                    this.src = `https://drive.google.com/uc?export=view&id=${driveId}`;
                } else {
                    slide.style.display = 'none';
                    const sIndex = adSlideElements.indexOf(slide);
                    if (sIndex > -1) adSlideElements.splice(sIndex, 1);
                    if (adSlideElements.length > 0 && slide.classList.contains('active')) {
                        rotateAds();
                    }
                }
            };
            
            slide.appendChild(image);
            viewport.appendChild(slide);
            adSlideElements.push(slide);
        });
    }

    async function fetchWeather(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,is_day&temperature_unit=fahrenheit&timezone=auto`;
            const res = await fetch(url);
            if (!res.ok) return null;
            const data = await res.json();
            
            if (data.timezone) targetTimeZone = data.timezone;
            if (data.current && data.current.is_day !== undefined) {
                isNightTimeSolar = (data.current.is_day === 0);
            }
            
            if (data.current && data.current.temperature_2m !== undefined) {
                const weatherData = { 
                    temp: Math.round(data.current.temperature_2m), 
                    realfeel: Math.round(data.current.apparent_temperature || data.current.temperature_2m) 
                };
                lastWeatherData = weatherData; 
                return weatherData;
            }
            return null;
        } catch(e) { 
            return null; 
        }
    }

    function updateWeatherUI(weather) {
        if (!weather || weather.temp === undefined) return;
        const tempDisplay = document.getElementById('sk-temp-val');
        if (tempDisplay) {
            tempDisplay.innerText = `${weather.temp}°`;
            let tempColor = "#ffffff";
            const t = weather.temp;
            if (t <= 32) tempColor = "#00f2ff"; 
            else if (t <= 50) tempColor = "#0ea5e9"; 
            else if (t <= 75) tempColor = "#FAC429"; 
            else if (t <= 90) tempColor = "#f97316"; 
            else tempColor = "#ef4444"; 
            tempDisplay.style.color = tempColor;
        }
    }

    function rotateAds() {
        if (adSlideElements.length === 0) return;
        adSlideElements[currentAdIndex].classList.remove('active');
        currentAdIndex = (currentAdIndex + 1) % adSlideElements.length;
        adSlideElements[currentAdIndex].classList.add('active');
    }

    function updateQuarterlySwap(quarter) {
        const logoGroup = document.querySelector('.sk-logo-group');
        const phoneDiv = document.querySelector('.sk-bottom-phone');
        if (!logoGroup || !phoneDiv) return;

        logoGroup.style.opacity = '0';
        phoneDiv.style.opacity = '0';
        
        setTimeout(() => {
            if (quarter % 2 === 0) {
                logoGroup.style.order = '1';
                logoGroup.style.justifyContent = 'flex-start';
                phoneDiv.style.order = '2';
                phoneDiv.style.justifyContent = 'center';
            } else {
                phoneDiv.style.order = '1';
                phoneDiv.style.justifyContent = 'flex-start';
                logoGroup.style.order = '2';
                logoGroup.style.justifyContent = 'center';
            }
            logoGroup.style.opacity = '1';
            phoneDiv.style.opacity = '1';
        }, 500);
    }

    function updateLocalTime() {
        const timeEl = document.getElementById('sk-time-val');
        if (!timeEl) return;
        
        let currentMin = new Date().getMinutes();

        try {
            const timeString = new Date().toLocaleTimeString('en-US', { timeZone: targetTimeZone, hour: '2-digit', minute:'2-digit', hour12: true });
            timeEl.innerText = timeString;
            const tzDate = new Date(new Date().toLocaleString('en-US', { timeZone: targetTimeZone }));
            currentMin = tzDate.getMinutes();
        } catch (e) {
            timeEl.innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
        }

        let currentQuarter = Math.floor(currentMin / 15);

        if (currentQuarterTracker !== currentQuarter) {
            const isInitialLoad = (currentQuarterTracker === null);
            currentQuarterTracker = currentQuarter;
            
            if (isInitialLoad) {
                const logoGroup = document.querySelector('.sk-logo-group');
                const phoneDiv = document.querySelector('.sk-bottom-phone');
                if (logoGroup && phoneDiv) {
                    if (currentQuarter % 2 === 0) {
                        logoGroup.style.order = '1'; logoGroup.style.justifyContent = 'flex-start';
                        phoneDiv.style.order = '2'; phoneDiv.style.justifyContent = 'center';
                    } else {
                        phoneDiv.style.order = '1'; phoneDiv.style.justifyContent = 'flex-start';
                        logoGroup.style.order = '2'; logoGroup.style.justifyContent = 'center';
                    }
                }
            } else {
                updateQuarterlySwap(currentQuarter);
            }
        }
    }

    async function startBillboard() {
        if (typeof lucide !== 'undefined') lucide.createIcons();

        // 1. Fetch Weather for Town Coordinates
        fetchWeather(activeConfig.coords.lat, activeConfig.coords.lon).then(w => {
            updateWeatherUI(w);
            syncTimeTheme();
        });

        // 2. Start Clock
        updateLocalTime();
        setInterval(updateLocalTime, 1000);

        // 3. Fetch Active Tab + Global Tab Ads in Row Sequence & Start Rotation
        await fetchAdImages();
        setInterval(rotateAds, displayInterval);

        // 4. Background Sync (Weather every 5 min, Ads every 1 min)
        setInterval(() => {
            fetchWeather(activeConfig.coords.lat, activeConfig.coords.lon).then(w => {
                updateWeatherUI(w);
                syncTimeTheme();
            });
        }, 300000); 

        setInterval(() => fetchAdImages(true), 60000);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") startBillboard();
    else document.addEventListener("DOMContentLoaded", startBillboard);
})();
</script>
