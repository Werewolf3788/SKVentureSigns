<script>
(function() {
    const firebaseConfig = {
        apiKey: "AIzaSyBYPbGWDhPUnCSnPWDP9wtiKe2P5WpinXg",
        authDomain: "smlc-fuel-monitor.firebaseapp.com",
        databaseURL: "https://smlc-fuel-monitor-default-rtdb.firebaseio.com",
        projectId: "smlc-fuel-monitor",
        storageBucket: "smlc-fuel-monitor.firebasestorage.app",
        messagingSenderId: "22397440085",
        appId: "1:22397440085:web:c00e716858ed58895bc4dc",
        measurementId: "G-687D605K75"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const displayInterval = 12000;      // 12-second billboard slide rotation
    const memoryRefreshCycle = 1800000; // 30-minute hardware GC reload

    let activeLocation = { name: "Flora", lat: 38.668700, lon: -88.485300, phone: "844-907-4450" };
    let currentAdIndex = 0;
    let adSlideElements = [];
    let currentAdQueue = [];
    let lastWeatherData = null;
    let targetTimeZone = "America/Chicago"; // Central Time default for S&K territory
    let isNightTimeSolar = null;
    let interactionTimer;
    let currentQuarterTracker = null;

    // Haversine Distance Calculation
    function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Programmatic VAST XML / Blip Endpoint Ingestion
    async function fetchProgrammaticAd(vastUrl) {
        if (!vastUrl) return null;
        try {
            const res = await fetch(vastUrl);
            const xmlText = await res.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");

            const mediaFile = xmlDoc.getElementsByTagName("MediaFile")[0];
            if (mediaFile && mediaFile.textContent) {
                return { type: 'video', url: mediaFile.textContent.trim(), isProgrammatic: true };
            }

            const staticResource = xmlDoc.getElementsByTagName("StaticResource")[0];
            if (staticResource && staticResource.textContent) {
                return { type: 'image', url: staticResource.textContent.trim(), isProgrammatic: true };
            }
        } catch (e) {}
        return null;
    }

    window.handleInteraction = function() {
        const backBtn = document.getElementById('ghost-back-btn');
        const fsBtn = document.getElementById('fullscreen-toggle-btn');
        if(backBtn) backBtn.classList.add('active');
        if(fsBtn) fsBtn.classList.add('active');
        clearTimeout(interactionTimer);
        interactionTimer = setTimeout(() => { 
            if(backBtn) backBtn.classList.remove('active'); 
            if(fsBtn) fsBtn.classList.remove('active'); 
        }, 3000);
    };

    window.toggleFullScreen = function() {
        const root = document.documentElement;
        if (!document.fullscreenElement) { 
            if (root.requestFullscreen) root.requestFullscreen();
            else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
            else if (root.msRequestFullscreen) root.msRequestFullscreen();
        } else { 
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    };

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(
        evt => document.addEventListener(evt, updateFsIcon)
    );

    function updateFsIcon() {
        const fsIcon = document.getElementById('fs-icon');
        const fsText = document.querySelector('#fullscreen-toggle-btn span');
        if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
            if(fsIcon) fsIcon.setAttribute('data-lucide', 'minimize');
            if(fsText) fsText.innerText = "Exit Full Screen";
        } else {
            if(fsIcon) fsIcon.setAttribute('data-lucide', 'maximize');
            if(fsText) fsText.innerText = "Full Screen";
        }
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function syncTimeTheme() {
        const root = document.getElementById('sk-billboard-root-container');
        if (!root) return;
        let isNightTime = (isNightTimeSolar !== null) ? isNightTimeSolar : (new Date().getHours() < 6 || new Date().getHours() >= 19);
        if (isNightTime) {
            root.classList.add('dark-mode');
            root.classList.remove('light-mode');
        } else {
            root.classList.add('light-mode');
            root.classList.remove('dark-mode');
        }
        if(lastWeatherData) updateWeatherUI(lastWeatherData);
    }

    // MAIN SINGLE-URL GEOLOCATION ENGINE
    db.ref("billboard_network/Locations").on("value", snapshot => {
        const locations = snapshot.val();
        if (!locations) return;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    let userLat = pos.coords.latitude;
                    let userLon = pos.coords.longitude;
                    let closestKey = "flora";
                    let minDistance = Infinity;

                    Object.keys(locations).forEach(key => {
                        if (key !== "global" && locations[key].lat && locations[key].lon) {
                            let dist = calculateDistanceMiles(userLat, userLon, locations[key].lat, locations[key].lon);
                            if (dist < minDistance) {
                                minDistance = dist;
                                closestKey = key;
                            }
                        }
                    });

                    // If within 40 miles of a board, bind strictly to that town.
                    // If you are remote (testing from afar), load complete network fallback!
                    if (minDistance <= 40) {
                        bindBillboardContent(locations, closestKey, false);
                    } else {
                        bindBillboardContent(locations, "flora", true); // Full Network Preview
                    }
                },
                err => {
                    // Fallback to Full Network Preview if GPS prompt ignored
                    bindBillboardContent(locations, "flora", true);
                },
                { timeout: 5000 }
            );
        } else {
            bindBillboardContent(locations, "flora", true);
        }
    });

    async function bindBillboardContent(locations, townKey, isRemotePreview) {
        const townData = locations[townKey] || locations["flora"];
        const globalData = locations["global"] || {};

        if (townData) {
            activeLocation = townData;
            const phoneDisplay = document.getElementById('sk-phone-display');
            if (phoneDisplay) phoneDisplay.innerText = activeLocation.phone || "844-907-4450";
            
            if (activeLocation.lat && activeLocation.lon) {
                fetchWeather(activeLocation.lat, activeLocation.lon);
            }

            const rawAdQueue = [];

            // 1. If viewing remotely, include ads from all towns + global so you see everything
            if (isRemotePreview) {
                Object.keys(locations).forEach(tKey => {
                    const tObj = locations[tKey];
                    Object.keys(tObj).forEach(k => {
                        if (!isNaN(parseInt(k)) && tObj[k] && tObj[k].imageurl) {
                            if (!rawAdQueue.some(item => item.url === tObj[k].imageurl)) {
                                rawAdQueue.push({ type: 'image', url: tObj[k].imageurl, isProgrammatic: false });
                            }
                        }
                    });
                });
            } else {
                // 2. Hardware Mode: Target Town Ads only
                Object.keys(townData).forEach(key => {
                    if (!isNaN(parseInt(key)) && townData[key] && townData[key].imageurl) {
                        rawAdQueue.push({ type: 'image', url: townData[key].imageurl, isProgrammatic: false });
                    }
                });

                // Plus Global network ads
                Object.keys(globalData).forEach(key => {
                    if (!isNaN(parseInt(key)) && globalData[key] && globalData[key].imageurl) {
                        if (!rawAdQueue.some(item => item.url === globalData[key].imageurl)) {
                            rawAdQueue.push({ type: 'image', url: globalData[key].imageurl, isProgrammatic: false });
                        }
                    }
                });
            }

            // 3. Programmatic VAST / Blip Ingestion
            const vastUrl = townData.vast_tag || globalData.vast_tag;
            if (vastUrl) {
                const programmaticItem = await fetchProgrammaticAd(vastUrl);
                if (programmaticItem) rawAdQueue.push(programmaticItem);
            }

            if (JSON.stringify(rawAdQueue) !== JSON.stringify(currentAdQueue)) {
                currentAdQueue = rawAdQueue;
                renderSlides();
            }
        }
    }

    function renderSlides() {
        const viewport = document.getElementById('sk-ad-viewport');
        if (!viewport) return;
        viewport.innerHTML = '';
        adSlideElements = [];
        currentAdIndex = 0;

        currentAdQueue.forEach((item, idx) => {
            const slide = document.createElement('div');
            slide.className = `sk-ad-slide ${idx === 0 ? 'active' : ''}`;

            if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.url;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.setAttribute('referrerpolicy', 'no-referrer');
                slide.appendChild(video);
            } else {
                const image = document.createElement('img');
                image.src = item.url;
                image.setAttribute('referrerpolicy', 'no-referrer');
                image.onerror = function() {
                    slide.style.display = 'none';
                    const sIndex = adSlideElements.indexOf(slide);
                    if (sIndex > -1) adSlideElements.splice(sIndex, 1);
                    if (adSlideElements.length > 0 && slide.classList.contains('active')) {
                        if (currentAdIndex >= adSlideElements.length) currentAdIndex = 0;
                        if (adSlideElements[currentAdIndex]) adSlideElements[currentAdIndex].classList.add('active');
                    }
                };
                slide.appendChild(image);
            }

            viewport.appendChild(slide);
            adSlideElements.push(slide);
        });
    }

    function rotateAds() {
        if (adSlideElements.length === 0) return;
        adSlideElements[currentAdIndex].classList.remove('active');
        currentAdIndex = (currentAdIndex + 1) % adSlideElements.length;
        adSlideElements[currentAdIndex].classList.add('active');

        const video = adSlideElements[currentAdIndex].querySelector('video');
        if (video) {
            video.currentTime = 0;
            video.play().catch(()=>{});
        }
    }

    async function fetchWeather(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,is_day&temperature_unit=fahrenheit&timezone=auto`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.timezone) targetTimeZone = data.timezone;
            if (data.current && data.current.is_day !== undefined) isNightTimeSolar = (data.current.is_day === 0);
            const weatherData = { temp: Math.round(data.current.temperature_2m), realfeel: Math.round(data.current.apparent_temperature) };
            lastWeatherData = weatherData;
            updateWeatherUI(weatherData);
            syncTimeTheme();
        } catch(e) {}
    }

    function updateWeatherUI(weather) {
        if (!weather) return;
        const tempDisplay = document.getElementById('sk-temp-val');
        if (tempDisplay) {
            tempDisplay.innerText = `${weather.temp}°`;
            let tempColor = "#ffffff";
            const t = weather.temp;
            if (t <= 32) tempColor = "#00f2ff"; 
            else if (t <= 50) tempColor = "#0ea5e9"; 
            else if (t <= 75) tempColor = "#FAC429"; 
            else if (t <= 90) tempColor = "#f97316"; 
            else tempColor = "#ef4444"; 
            tempDisplay.style.color = tempColor;
        }
    }

    function updateQuarterlySwap(quarter) {
        const logoGroup = document.querySelector('.sk-logo-group');
        const phoneDiv = document.querySelector('.sk-bottom-phone');
        if (!logoGroup || !phoneDiv) return;

        logoGroup.style.opacity = '0';
        phoneDiv.style.opacity = '0';
        
        setTimeout(() => {
            if (quarter % 2 === 0) {
                logoGroup.style.order = '1';
                logoGroup.style.justifyContent = 'flex-start';
                phoneDiv.style.order = '2';
                phoneDiv.style.justifyContent = 'center';
            } else {
                phoneDiv.style.order = '1';
                phoneDiv.style.justifyContent = 'flex-start';
                logoGroup.style.order = '2';
                logoGroup.style.justifyContent = 'center';
            }
            logoGroup.style.opacity = '1';
            phoneDiv.style.opacity = '1';
        }, 500);
    }

    function updateLocalTime() {
        const timeEl = document.getElementById('sk-time-val');
        if (!timeEl) return;
        
        let currentMin = new Date().getMinutes();

        try {
            const timeString = new Date().toLocaleTimeString('en-US', { timeZone: targetTimeZone, hour: '2-digit', minute:'2-digit', hour12: true });
            timeEl.innerText = timeString;
            
            const tzDate = new Date(new Date().toLocaleString('en-US', { timeZone: targetTimeZone }));
            currentMin = tzDate.getMinutes();
        } catch (e) {
            timeEl.innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
        }

        let currentQuarter = Math.floor(currentMin / 15);

        if (currentQuarterTracker !== currentQuarter) {
            const isInitialLoad = (currentQuarterTracker === null);
            currentQuarterTracker = currentQuarter;
            
            if (isInitialLoad) {
                const logoGroup = document.querySelector('.sk-logo-group');
                const phoneDiv = document.querySelector('.sk-bottom-phone');
                if (logoGroup && phoneDiv) {
                    if (currentQuarter % 2 === 0) {
                        logoGroup.style.order = '1'; logoGroup.style.justifyContent = 'flex-start';
                        phoneDiv.style.order = '2'; phoneDiv.style.justifyContent = 'center';
                    } else {
                        phoneDiv.style.order = '1'; phoneDiv.style.justifyContent = 'flex-start';
                        logoGroup.style.order = '2'; logoGroup.style.justifyContent = 'center';
                    }
                }
            } else {
                updateQuarterlySwap(currentQuarter);
            }
        }
    }

    function initBillboard() {
        if (typeof lucide !== 'undefined') lucide.createIcons();
        syncTimeTheme();

        updateLocalTime();
        setTimeout(() => { setInterval(updateLocalTime, 1000); }, 500);
        setInterval(rotateAds, displayInterval);
        setInterval(syncTimeTheme, 300000);

        setInterval(() => {
            window.location.reload();
        }, memoryRefreshCycle);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") initBillboard();
    else document.addEventListener("DOMContentLoaded", initBillboard);
})();
</script>
</body>
</html>
