    /* 3. HAVERSINE FORMULA (Distance to sign boards) */
    function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    /* 4. PROGRAMMATIC VAST PARSER & MACRO INJECTOR */
    function buildProgrammaticUrl(endpointUrl, locationMetadata) {
        if (!endpointUrl) return null;
        let resolvedUrl = endpointUrl;
        if (resolvedUrl.startsWith("//")) {
            resolvedUrl = window.location.protocol + resolvedUrl;
        }

        const timestamp = new Date().getTime();
        const screenId = locationMetadata.screen_id || "SK-DEFAULT-SCREEN";
        const venueId = locationMetadata.venue_id || "SK-DEFAULT-VENUE";
        const lat = locationMetadata.lat || 38.668700;
        const lon = locationMetadata.lon || -88.485300;
        const width = window.innerWidth || 1920;
        const height = (window.innerHeight - 100) || 1080;

        return resolvedUrl
            .replace(/\[SCREEN_ID\]/g, encodeURIComponent(screenId))
            .replace(/\[VENUE_ID\]/g, encodeURIComponent(venueId))
            .replace(/\[TIMESTAMP\]/g, timestamp)
            .replace(/\[CACHEBUSTER\]/g, timestamp)
            .replace(/\[LAT\]/g, lat)
            .replace(/\[LON\]/g, lon)
            .replace(/\[WIDTH\]/g, width)
            .replace(/\[HEIGHT\]/g, height);
    }

    async function fetchProgrammaticAd(rawVastUrl, locationMetadata) {
        const compiledUrl = buildProgrammaticUrl(rawVastUrl, locationMetadata);
        if (!compiledUrl) return null;

        try {
            const res = await fetch(compiledUrl, { cache: "no-store" });
            const xmlText = await res.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");

            const impressionTags = xmlDoc.getElementsByTagName("Impression");
            const trackingUrls = [];
            for (let i = 0; i < impressionTags.length; i++) {
                if (impressionTags[i].textContent) {
                    trackingUrls.push(impressionTags[i].textContent.trim());
                }
            }

            const mediaFile = xmlDoc.getElementsByTagName("MediaFile")[0];
            if (mediaFile && mediaFile.textContent) {
                return { type: 'video', url: mediaFile.textContent.trim(), isProgrammatic: true, impressions: trackingUrls };
            }

            const staticResource = xmlDoc.getElementsByTagName("StaticResource")[0];
            if (staticResource && staticResource.textContent) {
                return { type: 'image', url: staticResource.textContent.trim(), isProgrammatic: true, impressions: trackingUrls };
            }
        } catch (e) {
            console.warn("[SSP Engine] Programmatic fetch failed:", compiledUrl);
        }
        return null;
    }

        if (!impressions || !Array.isArray(impressions)) return;

            if (root.requestFullscreen) root.requestFullscreen();
            else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
            else if (root.msRequestFullscreen) root.msRequestFullscreen();
        } else { 
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    };

    function updateFsIcon() {
        const fsIcon = document.getElementById('fs-icon');
        const fsText = document.querySelector('#fullscreen-toggle-btn span');
        const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        
        if (isFS) {

    function syncTimeTheme() {

        let isNightTime = (isNightTimeSolar !== null) ? isNightTimeSolar : (new Date().getHours() < 6 || new Date().getHours() >= 19);

                        }
                    });
                });
            } else {
                Object.keys(townData).forEach(key => {
                    if (!isNaN(parseInt(key)) && townData[key] && townData[key].imageurl) {
                        rawAdQueue.push({ type: 'image', url: townData[key].imageurl, isProgrammatic: false });
                    }
                });

                Object.keys(globalData).forEach(key => {
                    if (!isNaN(parseInt(key)) && globalData[key] && globalData[key].imageurl) {
                        if (!rawAdQueue.some(item => item.url === globalData[key].imageurl)) {
                            rawAdQueue.push({ type: 'image', url: globalData[key].imageurl, isProgrammatic: false });
                        }
                    }
                });
            }

            // Programmatic VAST Ingestion
            if (activeLocation.vast_tag) {
                const programmaticCreative = await fetchProgrammaticAd(activeLocation.vast_tag, activeLocation);
                if (programmaticCreative) {
                    rawAdQueue.push(programmaticCreative);
                }
            }

            if (JSON.stringify(rawAdQueue) !== JSON.stringify(currentAdQueue)) {
                currentAdQueue = rawAdQueue;
                renderSlides();
            }
        }
    }

    /* 9. SLIDE DISPLAY & ROTATION */
    function renderSlides() {
        const viewport = document.getElementById('sk-ad-viewport');
        if (!viewport) return;
        viewport.innerHTML = '';
        adSlideElements = [];
        currentAdIndex = 0;

        currentAdQueue.forEach((item, idx) => {
            const slide = document.createElement('div');
            slide.className = `sk-ad-slide ${idx === 0 ? 'active' : ''}`;

            if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.url;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.setAttribute('referrerpolicy', 'no-referrer');
                slide.appendChild(video);
            } else {
                const image = document.createElement('img');
                image.src = item.url;
                image.setAttribute('referrerpolicy', 'no-referrer');
                image.onerror = function() {
                    slide.style.display = 'none';
                    const sIndex = adSlideElements.indexOf(slide);
                    if (sIndex > -1) adSlideElements.splice(sIndex, 1);
                    if (adSlideElements.length > 0 && slide.classList.contains('active')) {
                        if (currentAdIndex >= adSlideElements.length) currentAdIndex = 0;
                        if (adSlideElements[currentAdIndex]) adSlideElements[currentAdIndex].classList.add('active');
                    }
                };
                slide.appendChild(image);
            }

            viewport.appendChild(slide);
            adSlideElements.push(slide);
        });

        if (currentAdQueue[0] && currentAdQueue[0].isProgrammatic) {
            fireImpressionBeacons(currentAdQueue[0].impressions);
        }
    }

    function rotateAds() {
        if (adSlideElements.length === 0) return;
        adSlideElements[currentAdIndex].classList.remove('active');
        currentAdIndex = (currentAdIndex + 1) % adSlideElements.length;
        adSlideElements[currentAdIndex].classList.add('active');

        const activeMedia = currentAdQueue[currentAdIndex];
        if (activeMedia && activeMedia.isProgrammatic) {
            fireImpressionBeacons(activeMedia.impressions);
        }

        const video = adSlideElements[currentAdIndex].querySelector('video');
        if (video) {
            video.currentTime = 0;
            video.play().catch(()=>{});
        }
    }

    /* 10. OPEN-METEO WEATHER FETCH */
    async function fetchWeather(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,is_day&temperature_unit=fahrenheit&timezone=auto`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.timezone) targetTimeZone = data.timezone;
            if (data.current && data.current.is_day !== undefined) isNightTimeSolar = (data.current.is_day === 0);
            const weatherData = { temp: Math.round(data.current.temperature_2m), realfeel: Math.round(data.current.apparent_temperature) };
            lastWeatherData = weatherData;
            updateWeatherUI(weatherData);
            syncTimeTheme();
        } catch(e) {}
    }

    function updateWeatherUI(weather) {
        if (!weather) return;
        const tempDisplay = document.getElementById('sk-temp-val');
        if (tempDisplay) {
            tempDisplay.innerText = `${weather.temp}°`;
            let tempColor = "#ffffff";
            const t = weather.temp;
            if (t <= 32) tempColor = "#00f2ff"; 
            else if (t <= 50) tempColor = "#0ea5e9"; 
            else if (t <= 75) tempColor = "#FAC429"; 
            else if (t <= 90) tempColor = "#f97316"; 
            else tempColor = "#ef4444"; 
            tempDisplay.style.color = tempColor;
        }
    }

    /* 11. 15-MINUTE BRANDING POSITION FLIPPER & 24HR TIME */
    function updateQuarterlySwap(quarter) {
        const logoGroup = document.querySelector('.sk-logo-group');
        const phoneDiv = document.querySelector('.sk-bottom-phone');
        if (!logoGroup || !phoneDiv) return;

        logoGroup.style.opacity = '0';
        phoneDiv.style.opacity = '0';
        
        setTimeout(() => {
            if (quarter % 2 === 0) {
                logoGroup.style.order = '1';
                logoGroup.style.justifyContent = 'flex-start';
                phoneDiv.style.order = '2';
                phoneDiv.style.justifyContent = 'center';
            } else {
                phoneDiv.style.order = '1';
                phoneDiv.style.justifyContent = 'flex-start';
                logoGroup.style.order = '2';
                logoGroup.style.justifyContent = 'center';
            }
            logoGroup.style.opacity = '1';
            phoneDiv.style.opacity = '1';
        }, 500);
    }

    function updateLocalTime() {
        const timeEl = document.getElementById('sk-time-val');
        if (!timeEl) return;
        
        let currentMin = new Date().getMinutes();

        try {
            const timeString = new Date().toLocaleTimeString('en-US', { timeZone: targetTimeZone, hour: '2-digit', minute:'2-digit', hour12: true });
            timeEl.innerText = timeString;
            
            const tzDate = new Date(new Date().toLocaleString('en-US', { timeZone: targetTimeZone }));
            currentMin = tzDate.getMinutes();
        } catch (e) {
            timeEl.innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
        }

        let currentQuarter = Math.floor(currentMin / 15);

        if (currentQuarterTracker !== currentQuarter) {
            const isInitialLoad = (currentQuarterTracker === null);
            currentQuarterTracker = currentQuarter;
            
            if (isInitialLoad) {
                const logoGroup = document.querySelector('.sk-logo-group');
                const phoneDiv = document.querySelector('.sk-bottom-phone');
                if (logoGroup && phoneDiv) {
                    if (currentQuarter % 2 === 0) {
                        logoGroup.style.order = '1'; logoGroup.style.justifyContent = 'flex-start';
                        phoneDiv.style.order = '2'; phoneDiv.style.justifyContent = 'center';
                    } else {
                        phoneDiv.style.order = '1'; phoneDiv.style.justifyContent = 'flex-start';
                        logoGroup.style.order = '2'; logoGroup.style.justifyContent = 'center';
                    }
                }
            } else {
                updateQuarterlySwap(currentQuarter);
            }
        }
    }

    /* 12. INITIALIZATION & RECURRING TIMERS */
    function initBillboard() {
        if (typeof lucide !== 'undefined') lucide.createIcons();
        syncTimeTheme();

        updateLocalTime();
        setTimeout(() => { setInterval(updateLocalTime, 1000); }, 500);
        setInterval(rotateAds, displayInterval);
        setInterval(syncTimeTheme, 300000);

        setInterval(() => {
            window.location.reload();
        }, memoryRefreshCycle);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
        initBillboard();
    } else {
        document.addEventListener("DOMContentLoaded", initBillboard);
    }
})();
</script>
