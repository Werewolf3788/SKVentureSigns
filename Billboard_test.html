    function getTownFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('town') ? params.get('town').toLowerCase().trim() : null;
    }

    function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function buildProgrammaticUrl(endpointUrl, locationMetadata) {
        if (!endpointUrl) return null;
        let resolvedUrl = endpointUrl;
        if (resolvedUrl.startsWith("//")) {
            resolvedUrl = window.location.protocol + resolvedUrl;
        }

        const timestamp = new Date().getTime();
        const screenId = locationMetadata.screen_id || "SK-DEFAULT-SCREEN";
        const venueId = locationMetadata.venue_id || "SK-DEFAULT-VENUE";
        const lat = locationMetadata.lat || 38.668700;
        const lon = locationMetadata.lon || -88.485300;
        const width = window.innerWidth || 1920;
        const height = (window.innerHeight - 100) || 1080;

        return resolvedUrl
            .replace(/\[SCREEN_ID\]/g, encodeURIComponent(screenId))
            .replace(/\[VENUE_ID\]/g, encodeURIComponent(venueId))
            .replace(/\[TIMESTAMP\]/g, timestamp)
            .replace(/\[CACHEBUSTER\]/g, timestamp)
            .replace(/\[LAT\]/g, lat)
            .replace(/\[LON\]/g, lon)
            .replace(/\[WIDTH\]/g, width)
            .replace(/\[HEIGHT\]/g, height);
    }

    /* 3. GA4 SMLC BILLBOARD IMPRESSION LOGGER */
    function logSmlcAdImpression(adItem) {
        if (typeof gtag !== 'function' || !adItem) return;

        let providerType = 'direct_local';
        if (adItem.isProgrammatic) {

        } else if (adItem.type === 'house') {

        gtag('event', 'billboard_ad_impression', {

            'media_type': adItem.type || 'image',
            'creative_url': adItem.url || 'house_ad',
            'value': 1
        });
    }

    /* 4. PROGRAMMATIC FETCHER WITH TIMEOUT & CORS PROXY */
    async function fetchProgrammaticAd(rawUrl, locationMetadata, providerName) {
        let compiledUrl = buildProgrammaticUrl(rawUrl, locationMetadata);
        if (!compiledUrl) return null;

        if (compiledUrl.includes("blipbillboards.com") && !compiledUrl.includes("corsproxy.io")) {
            compiledUrl = "https://corsproxy.io/?" + encodeURIComponent(compiledUrl);
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);

        try {
            const res = await fetch(compiledUrl, { cache: "no-store", signal: controller.signal });
            clearTimeout(timeoutId);
            const contentType = res.headers.get("content-type") || "";

            if (contentType.includes("application/json") || providerName === "blip") {
                const data = await res.json();
                if (data && (data.image_url || data.media_url || data.url)) {
                    const mediaUrl = data.image_url || data.media_url || data.url;
                    const isVid = mediaUrl.match(/\.(mp4|webm)$/i);
                    return {
                        type: isVid ? 'video' : 'image',
                        url: mediaUrl,
                        isProgrammatic: true,
                        provider: 'blip',
                        impressions: data.impression_urls || (data.impression_url ? [data.impression_url] : [])
                    };
                }
            }

            const xmlText = await res.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");

            const impressionTags = xmlDoc.getElementsByTagName("Impression");
            const trackingUrls = [];
            for (let i = 0; i < impressionTags.length; i++) {
                if (impressionTags[i].textContent) {
                    trackingUrls.push(impressionTags[i].textContent.trim());
                }
            }

            const mediaFile = xmlDoc.getElementsByTagName("MediaFile")[0];
            if (mediaFile && mediaFile.textContent) {
                return { type: 'video', url: mediaFile.textContent.trim(), isProgrammatic: true, provider: 'vistar', impressions: trackingUrls };
            }

            const staticResource = xmlDoc.getElementsByTagName("StaticResource")[0];
            if (staticResource && staticResource.textContent) {
                return { type: 'image', url: staticResource.textContent.trim(), isProgrammatic: true, provider: 'vistar', impressions: trackingUrls };
            }
        } catch (e) {}
        return null;
    }

    function fireImpressionBeacons(impressions) {

    /* 6. THEME & GEOFENCE */
    function syncTimeTheme() {
        const root = document.getElementById('sk-billboard-root-container');
        if (!root) return;
        let isNightTime = (isNightTimeSolar !== null) ? isNightTimeSolar : (new Date().getHours() < 6 || new Date().getHours() >= 19);
        if (isNightTime) {
            root.classList.add('dark-mode');
            root.classList.remove('light-mode');
        } else {
            root.classList.add('light-mode');
            root.classList.remove('dark-mode');
        }
        if (lastWeatherData) updateWeatherUI(lastWeatherData);
    }

    /* 7. FIREBASE REALTIME LISTENER */
    db.ref().on("value", snapshot => {
        const rootData = snapshot.val();
        if (!rootData) return;

        const locations = (rootData.billboard_network && rootData.billboard_network.Locations) 
            ? rootData.billboard_network.Locations 
            : (rootData.Locations || rootData);

        const urlTown = getTownFromUrl();
        if (urlTown && locations[urlTown]) {
            bindBillboardContent(locations, urlTown, false);
            return;
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    let userLat = pos.coords.latitude;
                    let userLon = pos.coords.longitude;
                    let closestKey = "flora";
                    let minDistance = Infinity;

                    Object.keys(locations).forEach(key => {
                        if (key !== "global" && locations[key] && locations[key].lat && locations[key].lon) {
                            let dist = calculateDistanceMiles(userLat, userLon, locations[key].lat, locations[key].lon);
                            if (dist < minDistance) {
                                minDistance = dist;
                                closestKey = key;
                            }
                        }
                    });

                    // 40-Mile Geofence check
                    if (minDistance <= 40) {
                        bindBillboardContent(locations, closestKey, false);
                    } else {
                        bindBillboardContent(locations, "flora", true);
                    }
                },
                () => {
                    bindBillboardContent(locations, "flora", true);
                },
                { timeout: 4000 }
            );
        } else {
            bindBillboardContent(locations, "flora", true);
        }
    });

            ? townData.vast_tag 
            : ((globalData.vast_tag && globalData.vast_tag.trim() !== "") ? globalData.vast_tag : activeLocation.vast_tag);

        const resolvedBlipTag = (townData.blip_tag && townData.blip_tag.trim() !== "") 
            ? townData.blip_tag 
            : ((globalData.blip_tag && globalData.blip_tag.trim() !== "") ? globalData.blip_tag : activeLocation.blip_tag);

        activeLocation = {
            name: townData.name || townKey,
            lat: townData.lat || 38.668700,
            lon: townData.lon || -88.485300,
            phone: townData.phone || "844-907-4450",
            screen_id: townData.screen_id || `SK-${townKey.toUpperCase()}-01`,
            venue_id: townData.venue_id || `SK-VENUE-${townKey.toUpperCase()}`,
            vast_tag: resolvedVastTag,
            blip_tag: resolvedBlipTag
        };

        const phoneDisplay = document.getElementById('sk-phone-display');
        if (phoneDisplay) phoneDisplay.innerText = activeLocation.phone;
        
        if (activeLocation.lat && activeLocation.lon) {
            fetchWeather(activeLocation.lat, activeLocation.lon);
        }

        const immediateQueue = [];

        // A. REMOTE PREVIEW MODE: Load ALL ads from ALL towns
        if (isRemoteMasterFeed) {
            function extractAllAds(obj) {
                if (!obj || typeof obj !== 'object') return;
                const urlVal = obj.imageurl || obj.imageUrl || obj.url || (typeof obj === 'string' && obj.startsWith('http') ? obj : null);
                if (urlVal && typeof urlVal === 'string' && (urlVal.startsWith('http') || urlVal.startsWith('//'))) {
                    const cleanUrl = urlVal.trim();
                    if (!cleanUrl.includes('blipbillboards.com') && !cleanUrl.includes('vistar') && !cleanUrl.includes('S%26K%20Name.png')) {
                        if (!immediateQueue.some(item => item.url === cleanUrl)) {
                            const isVid = cleanUrl.match(/\.(mp4|webm|ogg)$/i);
                            immediateQueue.push({ type: isVid ? 'video' : 'image', url: cleanUrl, isProgrammatic: false });
                        }
                    }
                }
                Object.keys(obj).forEach(k => {
                    if (typeof obj[k] === 'object') extractAllAds(obj[k]);
                });
            }
            extractAllAds(locations);
        }
        // B. ON-SITE HARDWARE MODE: Strict 20-slot town loop
        else {
            for (let slotNum = 1; slotNum <= TOTAL_ROTATION_SLOTS; slotNum++) {
                const slotKey = String(slotNum);
                const slotItem = townData[slotKey];
                if (slotItem && slotItem.imageurl && slotItem.imageurl.trim() !== "") {
                    const cleanUrl = slotItem.imageurl.trim();
                    const isVid = cleanUrl.match(/\.(mp4|webm|ogg)$/i);
                    immediateQueue.push({ type: isVid ? 'video' : 'image', url: cleanUrl, isProgrammatic: false });
                }
            }
        }

        // House ad fallback if database is completely blank
        if (immediateQueue.length === 0) {
            immediateQueue.push({
                type: 'house',
                headline: "ADVERTISE HERE",
                subhead: `CALL ${activeLocation.phone}`,
                isProgrammatic: false
            });
        }

        currentAdQueue = immediateQueue;
        renderSlides();

        // Background programmatic injection for testing
        fetchLiveProgrammaticAsync();
    }

    async function fetchLiveProgrammaticAsync() {
        if (activeLocation.blip_tag) {
            const blipCreative = await fetchProgrammaticAd(activeLocation.blip_tag, activeLocation, 'blip');
            if (blipCreative && !currentAdQueue.some(item => item.url === blipCreative.url)) {
                currentAdQueue.push(blipCreative);
                renderSlides();
            }
        }
        if (activeLocation.vast_tag) {
            const vistarCreative = await fetchProgrammaticAd(activeLocation.vast_tag, activeLocation, 'vistar');
            if (vistarCreative && !currentAdQueue.some(item => item.url === vistarCreative.url)) {
                currentAdQueue.push(vistarCreative);
                renderSlides();
            }
        }
    }

    /* 9. SLIDE DISPLAY & ROTATION */
    function renderSlides() {
        const viewport = document.getElementById('sk-ad-viewport');
        if (!viewport) return;
        viewport.innerHTML = '';
        adSlideElements = [];
        currentAdIndex = 0;

        currentAdQueue.forEach((item, idx) => {
            const slide = document.createElement('div');
            slide.className = `sk-ad-slide ${idx === 0 ? 'active' : ''}`;

            if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.url;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.setAttribute('referrerpolicy', 'no-referrer');
                slide.appendChild(video);
            } else if (item.type === 'house') {
                const house = document.createElement('div');
                house.className = 'sk-house-slide';
                house.innerHTML = `<h1>${item.headline}</h1><p>${item.subhead}</p>`;
                slide.appendChild(house);
            } else {
                const image = document.createElement('img');
                image.src = item.url;
                image.setAttribute('referrerpolicy', 'no-referrer');
                image.onerror = function() {
                    slide.style.display = 'none';
                    const sIndex = adSlideElements.indexOf(slide);
                    if (sIndex > -1) adSlideElements.splice(sIndex, 1);
                    if (adSlideElements.length > 0 && slide.classList.contains('active')) {
                        if (currentAdIndex >= adSlideElements.length) currentAdIndex = 0;
                        if (adSlideElements[currentAdIndex]) adSlideElements[currentAdIndex].classList.add('active');
                    }
                };
                slide.appendChild(image);
            }

            viewport.appendChild(slide);
            adSlideElements.push(slide);
        });

        // Fire beacons & GA4 impression for the first active slide
        if (currentAdQueue[0]) {
            if (currentAdQueue[0].isProgrammatic && currentAdQueue[0].impressions) {
                fireImpressionBeacons(currentAdQueue[0].impressions);
            }
            logSmlcAdImpression(currentAdQueue[0]);
        }
    }

    function rotateAds() {
        if (adSlideElements.length === 0) return;
        adSlideElements[currentAdIndex].classList.remove('active');
        currentAdIndex = (currentAdIndex + 1) % adSlideElements.length;
        adSlideElements[currentAdIndex].classList.add('active');

        const activeMedia = currentAdQueue[currentAdIndex];
        if (activeMedia) {
            // 1. Third-party payout impression beacons
            if (activeMedia.isProgrammatic && activeMedia.impressions) {
                fireImpressionBeacons(activeMedia.impressions);
            }
            // 2. SMLC Custom GA4 Impression Logging
            logSmlcAdImpression(activeMedia);
        }

        const video = adSlideElements[currentAdIndex].querySelector('video');
        if (video) {
            video.currentTime = 0;
            video.play().catch(()=>{});
        }
    }

    /* 10. OPEN-METEO WEATHER FETCH */
    async function fetchWeather(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,is_day&temperature_unit=fahrenheit&timezone=auto`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.timezone) targetTimeZone = data.timezone;
            if (data.current && data.current.is_day !== undefined) isNightTimeSolar = (data.current.is_day === 0);
            const weatherData = { temp: Math.round(data.current.temperature_2m), realfeel: Math.round(data.current.apparent_temperature) };
            lastWeatherData = weatherData;
            updateWeatherUI(weatherData);
            syncTimeTheme();
        } catch(e) {}
    }

    function updateWeatherUI(weather) {
        if (!weather) return;
        const tempDisplay = document.getElementById('sk-temp-val');
        if (tempDisplay) {
            tempDisplay.innerText = `${weather.temp}°`;
            let tempColor = "#ffffff";
            const t = weather.temp;
            if (t <= 32) tempColor = "#00f2ff"; 
            else if (t <= 50) tempColor = "#0ea5e9"; 
            else if (t <= 75) tempColor = "#FAC429"; 
            else if (t <= 90) tempColor = "#f97316"; 
            else tempColor = "#ef4444"; 
            tempDisplay.style.color = tempColor;
        }
    }

    /* 11. 15-MINUTE BRANDING POSITION FLIPPER & 24HR TIME */
    function updateQuarterlySwap(quarter) {
        const logoGroup = document.querySelector('.sk-logo-group');
        const phoneDiv = document.querySelector('.sk-bottom-phone');
        if (!logoGroup || !phoneDiv) return;

        logoGroup.style.opacity = '0';
        phoneDiv.style.opacity = '0';
        
        setTimeout(() => {
            if (quarter % 2 === 0) {
                logoGroup.style.order = '1';
                logoGroup.style.justifyContent = 'flex-start';
                phoneDiv.style.order = '2';
                phoneDiv.style.justifyContent = 'center';
            } else {
                phoneDiv.style.order = '1';
                phoneDiv.style.justifyContent = 'flex-start';
                logoGroup.style.order = '2';
                logoGroup.style.justifyContent = 'center';
            }
            logoGroup.style.opacity = '1';
            phoneDiv.style.opacity = '1';
        }, 500);
    }

    function updateLocalTime() {
        const timeEl = document.getElementById('sk-time-val');
        if (!timeEl) return;
        
        let currentMin = new Date().getMinutes();

        try {
            const timeString = new Date().toLocaleTimeString('en-US', { timeZone: targetTimeZone, hour: '2-digit', minute:'2-digit', hour12: true });
            timeEl.innerText = timeString;
            
            const tzDate = new Date(new Date().toLocaleString('en-US', { timeZone: targetTimeZone }));
            currentMin = tzDate.getMinutes();
        } catch (e) {
            timeEl.innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
        }

        let currentQuarter = Math.floor(currentMin / 15);

        if (currentQuarterTracker !== currentQuarter) {
            const isInitialLoad = (currentQuarterTracker === null);
            currentQuarterTracker = currentQuarter;
            
            if (isInitialLoad) {
                const logoGroup = document.querySelector('.sk-logo-group');
                const phoneDiv = document.querySelector('.sk-bottom-phone');
                if (logoGroup && phoneDiv) {
                    if (currentQuarter % 2 === 0) {
                        logoGroup.style.order = '1'; logoGroup.style.justifyContent = 'flex-start';
                        phoneDiv.style.order = '2'; phoneDiv.style.justifyContent = 'center';
                    } else {
                        phoneDiv.style.order = '1'; phoneDiv.style.justifyContent = 'flex-start';
                        logoGroup.style.order = '2'; logoGroup.style.justifyContent = 'center';
                    }
                }
            } else {
                updateQuarterlySwap(currentQuarter);
            }
        }
    }

    /* 12. INITIALIZATION */
    function initBillboard() {
        if (typeof lucide !== 'undefined') lucide.createIcons();
        syncTimeTheme();

        updateLocalTime();
        setTimeout(() => { setInterval(updateLocalTime, 1000); }, 500);
        setInterval(rotateAds, displayInterval);
        setInterval(syncTimeTheme, 300000);

        setInterval(() => {
            window.location.reload();
        }, memoryRefreshCycle);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
        initBillboard();
    } else {
        document.addEventListener("DOMContentLoaded", initBillboard);
    }
})();
</script>
