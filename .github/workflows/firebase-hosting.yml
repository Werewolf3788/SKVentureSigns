# Deploys this repo (S&K Venture Signs) to Firebase Hosting: https://skventuresigns-c35d5.web.app
#
# NO KEYS AND NO GITHUB SECRETS. Google trusts this one repo directly ("workload identity"):
# GitHub proves to Google that the run came from Werewolf3788/SKVentureSigns, and Google lets it act
# as the project's own Firebase account. Nothing to copy, nothing to rotate, nothing to leak.
# One-time setup: a short block of commands run once in Google Cloud Shell for project skventuresigns-c35d5
# (creates the "github" trust pool and lets this repo act as firebase-adminsdk-fbsvc).
#
# Runs on every push to main (only when site files changed) and from Actions -> Run workflow.
# Free: this repo is public, so GitHub Actions minutes cost nothing; Firebase stays on the free
# Spark plan and Hosting keeps only the last 5 versions so storage never piles up.

name: Deploy SKVentureSigns to Firebase Hosting

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "README.md"
      - "raw codes/**"

permissions:
  contents: read
  id-token: write     # lets GitHub prove to Google which repo this run came from

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

env:
  PROJECT_ID: skventuresigns-c35d5
  PROJECT_NUMBER: "584793210858"
  DEPLOY_ACCOUNT: firebase-adminsdk-fbsvc@skventuresigns-c35d5.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Sign in to Google as this repo (no key)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/skventuresigns
          service_account: ${{ env.DEPLOY_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$PROJECT_ID" --non-interactive --message "SKVentureSigns ${GITHUB_SHA::7}"

      - name: Keep only the last 5 Hosting versions (stays in the free storage)
        uses: google-github-actions/auth@v2
        id: auth2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/skventuresigns
          service_account: ${{ env.DEPLOY_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase,https://www.googleapis.com/auth/cloud-platform

      - name: Set version limit
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ steps.auth2.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{"maxVersions":5}' \
            "https://firebasehosting.googleapis.com/v1beta1/sites/${PROJECT_ID}/config?updateMask=maxVersions" | head -c 200; echo
