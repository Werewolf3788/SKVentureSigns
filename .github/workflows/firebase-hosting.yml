# Deploys the site to Firebase Hosting.
#
# MANUAL ONLY: it runs when you start it yourself, from
#   GitHub -> Actions -> "Deploy player to Firebase Hosting" -> Run workflow.
# There is no push trigger, so pushing to the repo can never start (or fail) a deploy.
#
# To use it, add this repository secret once:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  FIREBASE_SERVICE_ACCOUNT
#   Value: the whole service-account .json file, all on one line.
# Without that secret the run stops with a clear message instead of a raw error.

name: Deploy player to Firebase Hosting

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Push to skventuresigns-c35d5.web.app
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Check the deploy key is configured
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::No FIREBASE_SERVICE_ACCOUNT secret. Settings -> Secrets and variables -> Actions -> New repository secret, and paste the service-account .json on one line."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: skventuresigns-c35d5
          channelId: live
