name: Fix S and K image links
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point broken images at the live image folder
        run: |
          python3 - <<'PY'
          repl = [
            ('https://i0.wp.com/skventuresigns.com/wp-content/uploads/2024/12/SK-tagline.png?v=10.7', 'https://skventuresigns.com/images/SK-tagline.png'),
            ('https://i0.wp.com/skventuresigns.com/wp-content/uploads/2024/12/SK-tagline.png', 'https://skventuresigns.com/images/SK-tagline.png'),
            ('https://i0.wp.com/skventuresigns.com/wp-content/uploads/2025/01/Topline.png?v=10.7', 'https://skventuresigns.com/images/Topline.png'),
            ('https://i0.wp.com/skventuresigns.com/wp-content/uploads/2025/01/Topline.png', 'https://skventuresigns.com/images/Topline.png'),
            ('https://i0.wp.com/skventuresigns.com/wp-content/uploads/2025/03/Customize.png?v=10.7', 'https://skventuresigns.com/images/Customize.png'),
            ('https://i0.wp.com/skventuresigns.com/wp-content/uploads/2025/03/Customize.png', 'https://skventuresigns.com/images/Customize.png'),
            ('https://i0.wp.com/skventuresigns.com/wp-content/uploads/2026/04/EFF-fair-locations.png?v=10.7', 'https://skventuresigns.com/images/EFF-fair-locations.png'),
            ('https://i0.wp.com/skventuresigns.com/wp-content/uploads/2026/04/EFF-fair-locations.png', 'https://skventuresigns.com/images/EFF-fair-locations.png'),
            ('https://skventuresigns.com/wp-content/uploads/2025/03/SK-Sign-Black.png', 'https://skventuresigns.com/images/S%26K-Sign-Black.png'),
            ('https://skventuresigns.com/wp-content/uploads/2025/03/SK-Sign-White.png', 'https://skventuresigns.com/images/S%26K-Sign-White.png'),
          ]
          files = ['index.html', 'Navigation.html', 'Services.html', 'test.html']
          for name in files:
              try:
                  text = open(name, encoding='utf-8').read()
              except FileNotFoundError:
                  continue
              before = text
              for old, new in repl:
                  text = text.replace(old, new)
              if text != before:
                  open(name, 'w', encoding='utf-8').write(text)
          PY
          if git diff --quiet; then echo "Nothing to fix"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix broken S and K image links"
          git push