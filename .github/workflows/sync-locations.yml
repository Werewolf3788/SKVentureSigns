name: Sync the deployed Locations page

# One-off job: the Locations page and its Firebase loader were finished and deployed,
# but the copies in this repository were older. This copies the deployed files in and
# then removes itself, so the repo matches what the site is actually serving.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-locations.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the deployed files and remove this job
        run: |
          set -e
          base=https://skventuresigns-c35d5.web.app
          curl -fsSL "$base/Locations.html?sync=$GITHUB_RUN_ID" -o Locations.html
          curl -fsSL "$base/locations-live.js?sync=$GITHUB_RUN_ID" -o locations-live.js
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'Locations.html': ['locations-live.js?v=3', '</html>'],
              'locations-live.js': ['groupFirestore', 'skvl-coord'],
          }
          for name, needles in checks.items():
              text = Path(name).read_text()
              for needle in needles:
                  assert needle in text, name + ' is missing ' + needle
          print('both files look complete')
          PY
          rm -f .github/workflows/sync-locations.yml
          git config user.name "S&K Site Bot"
          git config user.email "site-bot@skventuresigns.com"
          git add -A
          git diff --cached --quiet || git commit -m "Locations page reads Firestore and the Realtime Database, with latitude and longitude on each map"
          git push
