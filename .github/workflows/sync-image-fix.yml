name: Sync fixed image links
on: push
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bring the fixed pages over from main
        run: |
          git checkout origin/main -- index.html Navigation.html Services.html test.html
          if git diff --quiet; then echo "Nothing to sync"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bring the fixed S and K image links onto the published copy"
          git push